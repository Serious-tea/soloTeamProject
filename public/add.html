<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <title>Додати оголошення</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <form id="adForm">
    <input type="text" name="title" placeholder="Назва оголошення" required />
    <textarea name="content" placeholder="Опис оголошення" required></textarea>
    <button type="submit">Надіслати</button>
  </form>
  <script>
    document.getElementById('adForm').onsubmit = async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());
      await fetch('/ads', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      window.location.href = '/';
    };
  </script>
</body>
</html>
